<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bingo Familiar — Juego</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="banda-textil" role="presentation"></div>

<div class="pagina">
  <header class="encabezado no-imprimir">
    <a class="marca" href="index.html">
      <span class="marca__insignia" aria-hidden="true"><span>B</span></span>
      <span class="marca__texto">Bingo Familiar</span>
    </a>
    <nav class="navegacion" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="juego.html" aria-current="page">Juego</a>
      <a href="imprimir.html">Imprimir Cartones</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
  </header>

  <main>
    <div class="contenedor">

      <div class="tarjeta" style="margin-bottom: 24px; display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between;">
        <div class="campo">
          <label for="velocidad">Velocidad automática</label>
          <select id="velocidad">
            <option value="2500">Rápida (2.5s)</option>
            <option value="4000" selected>Normal (4s)</option>
            <option value="6000">Pausada (6s)</option>
          </select>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-weight:700;">
          <input type="checkbox" id="sonido" checked />
          Sonido activado
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-weight:700;">
          <input type="checkbox" id="altoContraste" />
          Alto contraste
        </label>
      </div>

      <div class="tablero-juego">
        <section class="tarjeta panel-bola" aria-live="polite">
          <h2>Bola actual</h2>
          <div id="bolaActual" class="bola-actual bola-actual--vacia">
            <span class="bola-actual__letra" id="bolaLetra">&nbsp;</span>
            <span class="bola-actual__numero" id="bolaNumero">—</span>
          </div>
          <p class="frase-llamado" id="fraseLlamado">Presiona "Siguiente" para comenzar</p>
          <p class="contador-restantes" id="contadorRestantes">75 bolas por llamar</p>

          <div class="controles-juego">
            <button class="boton boton--secundario" id="btnAnterior" aria-label="Bola anterior">⟲ Anterior</button>
            <button class="boton boton--primario boton--grande" id="btnSiguiente">Siguiente ▶</button>
            <button class="boton boton--secundario" id="btnAutoplay" aria-label="Reproducir automáticamente">▶ Reproducir</button>
          </div>
          <div class="controles-juego">
            <button class="boton boton--acento" id="btnReiniciar">↺ Reiniciar</button>
            <button class="boton boton--secundario" id="btnFinalizar">⏹ Finalizar</button>
            <button class="boton boton--exito" id="btnGanador">🏆 Declarar Ganador</button>
          </div>
        </section>

        <section class="panel-derecho">
          <div class="tarjeta">
            <h3>Referencia B-I-N-G-O</h3>
            <div class="tabla-referencia" id="tablaReferencia" aria-label="Todos los números del 1 al 75"></div>
          </div>

          <div class="tarjeta">
            <h3>Historial de llamados</h3>
            <div class="historial" id="historial">
              <span class="contador-restantes">Aún no se ha llamado ninguna bola.</span>
            </div>
          </div>
        </section>
      </div>

    </div>
  </main>

  <footer class="pie no-imprimir">
    Bingo Familiar en Español · v1.0
  </footer>
</div>

<!-- Pantalla Ganador -->
<div class="pantalla-ganador" id="pantallaGanador" hidden role="dialog" aria-modal="true" aria-labelledby="tituloGanador">
  <div class="tarjeta-ganador marco-textil">
    <div style="padding: 8px;">
      <div class="tarjeta-ganador__emoji" aria-hidden="true">🎉</div>
      <h2 id="tituloGanador">¡BINGO!</h2>
      <p>Tenemos un ganador. ¡Felicidades!</p>
      <div class="grupo-botones" style="justify-content:center; margin-top: 16px;">
        <button class="boton boton--primario" id="btnCerrarGanador">Continuar jugando</button>
        <button class="boton boton--acento" id="btnNuevaPartidaGanador">Nueva partida</button>
      </div>
    </div>
  </div>
</div>

<script src="js/engine/bingoEngine.js"></script>
<script src="js/audio/audio.js"></script>
<script src="js/ui/confetti.js"></script>
<script src="js/ui/juego.js"></script>
</body>
</html>
