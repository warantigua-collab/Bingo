<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bingo Familiar — Imprimir Cartones</title>
<style>
/* =========================================================================
   Bingo Familiar — Sistema de Diseño
   Paleta guatemalteca + claridad tipo Apple. Motivo textil como firma visual.
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap');

:root {
  /* Paleta — inspirada en textiles guatemaltecos */
  --rojo-tejido: #c0392b;
  --turquesa: #14919b;
  --azul-profundo: #1b3a6b;
  --amarillo-maiz: #f2b705;
  --verde-jade: #1e8a6e;
  --morado: #6b2d75;
  --marfil: #fbf7ee;
  --marfil-suave: #f3ecdd;
  --carbon: #2a2420;
  --carbon-suave: #5a5049;

  --blanco: #ffffff;

  /* Tipografía */
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Radios y sombras — estilo Apple: suave, generoso */
  --radio-sm: 12px;
  --radio-md: 20px;
  --radio-lg: 28px;
  --sombra-sm: 0 2px 8px rgba(42, 36, 32, 0.08);
  --sombra-md: 0 8px 24px rgba(42, 36, 32, 0.12);
  --sombra-lg: 0 16px 40px rgba(42, 36, 32, 0.16);

  --espacio-1: 8px;
  --espacio-2: 16px;
  --espacio-3: 24px;
  --espacio-4: 32px;
  --espacio-5: 48px;
  --espacio-6: 64px;

  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--marfil);
  color: var(--carbon);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0 0 var(--espacio-2) 0;
  letter-spacing: -0.01em;
}

h1 { font-size: clamp(2rem, 4vw, 2.75rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.25rem; }

p { margin: 0 0 var(--espacio-2) 0; }

a { color: var(--turquesa); }

img, svg { max-width: 100%; display: block; }

button {
  font-family: var(--font-body);
}

:focus-visible {
  outline: 3px solid var(--turquesa);
  outline-offset: 3px;
}

/* =========================================================================
   Firma visual: banda textil (zigzag tejido), sin imágenes — solo CSS.
   Se usa como cabecera, divisor y marco alrededor de la bola y el ganador.
   ========================================================================= */

.banda-textil {
  height: 14px;
  width: 100%;
  background-image:
    linear-gradient(135deg, var(--rojo-tejido) 25%, transparent 25.5%, transparent 50%, var(--rojo-tejido) 50.5%, var(--rojo-tejido) 75%, transparent 75.5%),
    linear-gradient(45deg, var(--amarillo-maiz) 25%, transparent 25.5%, transparent 50%, var(--amarillo-maiz) 50.5%, var(--amarillo-maiz) 75%, transparent 75.5%);
  background-size: 28px 14px, 28px 14px;
  background-position: 0 0, 14px 0;
  background-repeat: repeat-x;
  background-color: var(--turquesa);
}

.banda-textil--compacta {
  height: 8px;
}

.marco-textil {
  position: relative;
  padding: 6px;
  background: linear-gradient(135deg, var(--rojo-tejido), var(--amarillo-maiz), var(--turquesa), var(--morado));
  border-radius: var(--radio-lg);
}

.marco-textil > * {
  border-radius: calc(var(--radio-lg) - 6px);
  background: var(--blanco);
}

/* =========================================================================
   Layout base
   ========================================================================= */

.pagina {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.encabezado {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--espacio-2) var(--espacio-4);
  background: var(--blanco);
  box-shadow: var(--sombra-sm);
  position: relative;
  z-index: 5;
}

.marca {
  display: flex;
  align-items: center;
  gap: var(--espacio-2);
  text-decoration: none;
  color: var(--carbon);
}

.marca__insignia {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: conic-gradient(var(--rojo-tejido), var(--amarillo-maiz), var(--verde-jade), var(--turquesa), var(--morado), var(--rojo-tejido));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--sombra-sm);
}

.marca__insignia span {
  background: var(--blanco);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--azul-profundo);
}

.marca__texto {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.15rem;
}

nav.navegacion {
  display: flex;
  gap: var(--espacio-1);
}

nav.navegacion a {
  text-decoration: none;
  color: var(--carbon-suave);
  font-weight: 700;
  padding: 10px 16px;
  border-radius: 999px;
  transition: background 0.15s ease, color 0.15s ease;
}

nav.navegacion a:hover {
  background: var(--marfil-suave);
  color: var(--carbon);
}

nav.navegacion a[aria-current="page"] {
  background: var(--azul-profundo);
  color: var(--blanco);
}

main {
  flex: 1;
  width: 100%;
}

.contenedor {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--espacio-4);
}

footer.pie {
  text-align: center;
  padding: var(--espacio-3);
  color: var(--carbon-suave);
  font-size: 0.9rem;
}

/* =========================================================================
   Botones
   ========================================================================= */

.boton {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 1.05rem;
  border: none;
  border-radius: var(--radio-md);
  padding: 16px 28px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: var(--sombra-sm);
  min-height: 56px;
}

.boton:active {
  transform: scale(0.97);
}

.boton:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.boton--primario {
  background: var(--azul-profundo);
  color: var(--blanco);
}
.boton--primario:hover:not(:disabled) { background: #16305a; box-shadow: var(--sombra-md); }

.boton--acento {
  background: var(--rojo-tejido);
  color: var(--blanco);
}
.boton--acento:hover:not(:disabled) { background: #a83324; box-shadow: var(--sombra-md); }

.boton--exito {
  background: var(--verde-jade);
  color: var(--blanco);
}
.boton--exito:hover:not(:disabled) { background: #156f59; box-shadow: var(--sombra-md); }

.boton--secundario {
  background: var(--blanco);
  color: var(--azul-profundo);
  border: 2px solid var(--marfil-suave);
}
.boton--secundario:hover:not(:disabled) { border-color: var(--azul-profundo); }

.boton--grande {
  font-size: 1.25rem;
  padding: 20px 36px;
  min-height: 68px;
}

.boton--icono {
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 50%;
}

.grupo-botones {
  display: flex;
  gap: var(--espacio-2);
  flex-wrap: wrap;
}

/* =========================================================================
   Tarjetas / Cards genéricas
   ========================================================================= */

.tarjeta {
  background: var(--blanco);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra-md);
  padding: var(--espacio-4);
}

.rejilla {
  display: grid;
  gap: var(--espacio-3);
}

.rejilla--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.rejilla--3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* =========================================================================
   Inicio — menú principal
   ========================================================================= */

.hero {
  text-align: center;
  padding: var(--espacio-6) var(--espacio-3) var(--espacio-4);
}

.hero__ojo {
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.85rem;
  color: var(--rojo-tejido);
  background: #f9e7e2;
  padding: 6px 16px;
  border-radius: 999px;
  margin-bottom: var(--espacio-2);
}

.hero p.subtitulo {
  font-size: 1.2rem;
  color: var(--carbon-suave);
  max-width: 560px;
  margin: 0 auto var(--espacio-4);
}

.tarjeta-menu {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-2);
  text-decoration: none;
  color: var(--carbon);
  background: var(--blanco);
  border-radius: var(--radio-lg);
  padding: var(--espacio-4);
  box-shadow: var(--sombra-md);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  border-top: 6px solid var(--turquesa);
}

.tarjeta-menu:hover {
  transform: translateY(-4px);
  box-shadow: var(--sombra-lg);
}

.tarjeta-menu--juego { border-top-color: var(--rojo-tejido); }
.tarjeta-menu--imprimir { border-top-color: var(--amarillo-maiz); }
.tarjeta-menu--ayuda { border-top-color: var(--morado); }

.tarjeta-menu__icono {
  font-size: 2.5rem;
}

.tarjeta-menu__accion {
  margin-top: auto;
  font-weight: 800;
  color: var(--azul-profundo);
}

/* =========================================================================
   Pantalla de Juego — el llamador
   ========================================================================= */

.tablero-juego {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: var(--espacio-4);
  align-items: start;
}

@media (max-width: 860px) {
  .tablero-juego {
    grid-template-columns: 1fr;
  }
}

.panel-bola {
  text-align: center;
}

.bola-actual {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  margin: var(--espacio-2) auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--blanco);
  font-family: var(--font-display);
  box-shadow: var(--sombra-lg), inset 0 -8px 16px rgba(0,0,0,0.12);
  position: relative;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}

.bola-actual.rebote {
  animation: rebote 0.5s cubic-bezier(.34,1.56,.64,1);
}

@keyframes rebote {
  0% { transform: scale(0.4) translateY(-140px); opacity: 0; }
  60% { transform: scale(1.08) translateY(0); opacity: 1; }
  80% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

.bola-actual__letra {
  font-size: 1.6rem;
  font-weight: 600;
  opacity: 0.9;
}

.bola-actual__numero {
  font-size: 4.5rem;
  font-weight: 700;
  line-height: 1;
}

.bola-actual--vacia {
  background: var(--marfil-suave) !important;
  color: var(--carbon-suave);
  box-shadow: var(--sombra-sm);
}

.bola-actual--B { background: linear-gradient(155deg, var(--rojo-tejido), #93261a); }
.bola-actual--I { background: linear-gradient(155deg, var(--amarillo-maiz), #c78e00); color: var(--carbon); }
.bola-actual--N { background: linear-gradient(155deg, var(--verde-jade), #12604c); }
.bola-actual--G { background: linear-gradient(155deg, var(--turquesa), #0d6d75); }
.bola-actual--O { background: linear-gradient(155deg, var(--morado), #4a1f52); }

.frase-llamado {
  font-size: 1.4rem;
  font-weight: 800;
  min-height: 2em;
  color: var(--azul-profundo);
}

.contador-restantes {
  color: var(--carbon-suave);
  font-weight: 600;
}

.controles-juego {
  display: flex;
  justify-content: center;
  gap: var(--espacio-2);
  flex-wrap: wrap;
  margin-top: var(--espacio-3);
}

.panel-derecho {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-3);
}

/* Tabla de referencia B-I-N-G-O con todos los números */
.tabla-referencia {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.columna-letra {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.columna-letra__titulo {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--blanco);
  width: 100%;
  text-align: center;
  border-radius: var(--radio-sm);
  padding: 6px 0;
}

.columna-letra__titulo--B { background: var(--rojo-tejido); }
.columna-letra__titulo--I { background: var(--amarillo-maiz); color: var(--carbon); }
.columna-letra__titulo--N { background: var(--verde-jade); }
.columna-letra__titulo--G { background: var(--turquesa); }
.columna-letra__titulo--O { background: var(--morado); }

.numero-ref {
  width: 100%;
  text-align: center;
  padding: 5px 0;
  border-radius: 8px;
  font-weight: 700;
  color: var(--carbon-suave);
  background: var(--marfil-suave);
  font-size: 0.85rem;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.numero-ref.llamado {
  background: var(--azul-profundo);
  color: var(--blanco);
  transform: scale(1.05);
}

.numero-ref.actual {
  background: var(--rojo-tejido);
  color: var(--blanco);
  box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.35);
}

/* Historial de llamados (chips) */
.historial {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
  padding: var(--espacio-1);
}

.chip-numero {
  background: var(--marfil-suave);
  color: var(--carbon);
  font-weight: 800;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.9rem;
}

.chip-numero:first-child {
  background: var(--azul-profundo);
  color: var(--blanco);
}

/* =========================================================================
   Pantalla Ganador
   ========================================================================= */

.pantalla-ganador {
  position: fixed;
  inset: 0;
  background: rgba(27, 58, 107, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: var(--espacio-3);
}

.pantalla-ganador[hidden] { display: none; }

.tarjeta-ganador {
  background: var(--blanco);
  border-radius: var(--radio-lg);
  padding: var(--espacio-5);
  text-align: center;
  max-width: 420px;
  box-shadow: var(--sombra-lg);
  animation: aparecer 0.4s cubic-bezier(.34,1.56,.64,1);
}

@keyframes aparecer {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.tarjeta-ganador__emoji {
  font-size: 4rem;
}

.confeti-pieza {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  z-index: 99;
  pointer-events: none;
  animation-name: caer;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes caer {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(600deg); opacity: 0.9; }
}

/* =========================================================================
   Imprimir Cartones
   ========================================================================= */

.controles-impresion {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-3);
  align-items: end;
  margin-bottom: var(--espacio-3);
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.campo label {
  font-weight: 800;
  font-size: 0.9rem;
  color: var(--carbon-suave);
}

.campo select,
.campo input[type="number"] {
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 10px 14px;
  border-radius: var(--radio-sm);
  border: 2px solid var(--marfil-suave);
  background: var(--blanco);
  min-width: 160px;
}

.hoja-cartones {
  background: var(--blanco);
  page-break-after: always;
  padding: 24px;
  display: grid;
  gap: 18px;
}

.hoja-cartones[data-por-hoja="1"] { grid-template-columns: 1fr; }
.hoja-cartones[data-por-hoja="2"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
.hoja-cartones[data-por-hoja="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.hoja-cartones[data-por-hoja="6"] { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }

.carton {
  border: 3px solid var(--carbon);
  border-radius: var(--radio-sm);
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.carton__cabecera {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.carton__titulo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
}

.carton__serial {
  font-size: 0.7rem;
  color: var(--carbon-suave);
}

.carton table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.carton th {
  font-family: var(--font-display);
  color: var(--blanco);
  font-size: 0.9rem;
  padding: 4px 0;
}

.carton th:nth-child(1) { background: var(--rojo-tejido); }
.carton th:nth-child(2) { background: var(--amarillo-maiz); color: var(--carbon); }
.carton th:nth-child(3) { background: var(--verde-jade); }
.carton th:nth-child(4) { background: var(--turquesa); }
.carton th:nth-child(5) { background: var(--morado); }

.carton td {
  border: 1px solid var(--marfil-suave);
  text-align: center;
  font-weight: 700;
  padding: 6px 0;
}

.carton td.libre {
  background: var(--marfil-suave);
  font-size: 0.65rem;
  color: var(--carbon-suave);
  font-weight: 800;
}

.vista-previa-cartones {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-4);
}

@media print {
  .no-imprimir { display: none !important; }
  body { background: var(--blanco); }
  .hoja-cartones { box-shadow: none; }
}

/* =========================================================================
   Ayuda
   ========================================================================= */

.acordeon {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-2);
}

.acordeon details {
  background: var(--blanco);
  border-radius: var(--radio-md);
  box-shadow: var(--sombra-sm);
  padding: var(--espacio-2) var(--espacio-3);
}

.acordeon summary {
  font-family: var(--font-display);
  font-weight: 600;
  cursor: pointer;
  font-size: 1.05rem;
}

.acordeon details[open] summary {
  margin-bottom: var(--espacio-2);
}

/* =========================================================================
   Accesibilidad y responsive general
   ========================================================================= */

.solo-lectores {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .encabezado {
    flex-direction: column;
    gap: var(--espacio-2);
    padding: var(--espacio-2);
  }
  .contenedor { padding: var(--espacio-2); }
  .bola-actual { width: 170px; height: 170px; }
  .bola-actual__numero { font-size: 3.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* Alto contraste opcional */
body.alto-contraste {
  --marfil: #ffffff;
  --marfil-suave: #eeeeee;
  --carbon: #000000;
  --carbon-suave: #000000;
}

body.alto-contraste .boton {
  border: 2px solid #000;
}

</style>
<style id="tamanoPagina">
  @page { size: letter; margin: 0.4in; }
</style>
</head>
<body>
<div class="banda-textil no-imprimir" role="presentation"></div>

<div class="pagina">
  <header class="encabezado no-imprimir">
    <a class="marca" href="index.html">
      <span class="marca__insignia" aria-hidden="true"><span>B</span></span>
      <span class="marca__texto">Bingo Familiar</span>
    </a>
    <nav class="navegacion" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="juego.html">Juego</a>
      <a href="imprimir.html" aria-current="page">Imprimir Cartones</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
  </header>

  <main>
    <div class="contenedor">
      <h1 class="no-imprimir">Imprimir Cartones</h1>
      <p class="no-imprimir">Genera cartones únicos, revisa la vista previa y luego imprime.</p>

      <div class="tarjeta no-imprimir">
        <div class="controles-impresion">
          <div class="campo">
            <label for="cantidad">Cantidad de cartones</label>
            <input type="number" id="cantidad" min="1" max="200" value="12" />
          </div>
          <div class="campo">
            <label for="formato">Tamaño de página</label>
            <select id="formato">
              <option value="letter" selected>Carta (Letter)</option>
              <option value="a4">A4</option>
            </select>
          </div>
          <div class="campo">
            <label for="porHoja">Cartones por hoja</label>
            <select id="porHoja">
              <option value="1">1 por hoja</option>
              <option value="2">2 por hoja</option>
              <option value="4" selected>4 por hoja</option>
              <option value="6">6 por hoja</option>
            </select>
          </div>
          <button class="boton boton--primario" id="btnGenerar">Generar cartones</button>
          <button class="boton boton--exito" id="btnImprimir">🖨️ Imprimir</button>
        </div>
        <p class="contador-restantes" id="resumen">Aún no se han generado cartones.</p>
      </div>

      <div class="vista-previa-cartones" id="vistaPrevia"></div>
    </div>
  </main>

  <footer class="pie no-imprimir">
    Bingo Familiar en Español · v1.0
  </footer>
</div>

<script>
/**
 * cardGenerator.js
 * Generador de cartones de Bingo 5x5 (B-I-N-G-O) con centro libre.
 * Funciona en navegador (window.CardGenerator) y en Node para pruebas.
 */
(function (root) {
  "use strict";

  const COLS = [
    { letter: "B", min: 1, max: 15 },
    { letter: "I", min: 16, max: 30 },
    { letter: "N", min: 31, max: 45 },
    { letter: "G", min: 46, max: 60 },
    { letter: "O", min: 61, max: 75 },
  ];

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor((rng ? rng() : Math.random()) * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rangeArray(min, max) {
    const out = [];
    for (let i = min; i <= max; i++) out.push(i);
    return out;
  }

  // Genera un solo cartón: objeto { B:[5], I:[5], N:[5 con null en el centro], G:[5], O:[5] }
  function generateCard(options) {
    options = options || {};
    const rng = options.rng;
    const card = {};
    COLS.forEach((col) => {
      const pool = shuffle(rangeArray(col.min, col.max), rng);
      card[col.letter] = pool.slice(0, 5);
    });
    // Centro libre
    card.N[2] = null;
    return card;
  }

  // Convierte el cartón (por columnas) a filas para renderizar una tabla 5x5
  function toRows(card) {
    const rows = [];
    for (let r = 0; r < 5; r++) {
      rows.push(COLS.map((col) => card[col.letter][r]));
    }
    return rows;
  }

  // Genera un identificador corto y legible para el cartón (para control del anfitrión)
  function cardSerial(card, index) {
    const flat = COLS.map((c) => card[c.letter].map((n) => (n === null ? "FR" : n)).join("-")).join("_");
    let hash = 0;
    for (let i = 0; i < flat.length; i++) {
      hash = (hash * 31 + flat.charCodeAt(i)) >>> 0;
    }
    const code = hash.toString(36).toUpperCase().slice(0, 5);
    return `C${String(index + 1).padStart(3, "0")}-${code}`;
  }

  // Genera un lote de N cartones únicos (comparando su representación de filas)
  function generateBatch(count, options) {
    options = options || {};
    const rng = options.rng;
    const seen = new Set();
    const cards = [];
    let attempts = 0;
    const maxAttempts = count * 50 + 100;
    while (cards.length < count && attempts < maxAttempts) {
      attempts++;
      const card = generateCard({ rng });
      const key = COLS.map((c) => card[c.letter].join(",")).join("|");
      if (seen.has(key)) continue;
      seen.add(key);
      cards.push(card);
    }
    return cards.map((card, i) => ({
      card,
      rows: toRows(card),
      serial: cardSerial(card, i),
    }));
  }

  // Verifica si un cartón tiene Bingo dado un conjunto de números llamados.
  // patterns: 'linea' (fila, columna o diagonal) o 'lleno' (cartón completo)
  function checkWin(card, calledSet, pattern) {
    pattern = pattern || "linea";
    const rows = toRows(card);
    const isMarked = (n) => n === null || calledSet.has(n);

    const rowsMarked = rows.map((row) => row.every(isMarked));
    const colsMarked = COLS.map((_, ci) => rows.every((row) => isMarked(row[ci])));
    const diag1 = rows.every((row, ri) => isMarked(row[ri]));
    const diag2 = rows.every((row, ri) => isMarked(row[4 - ri]));

    if (pattern === "lleno") {
      return rows.every((row) => row.every(isMarked));
    }

    return (
      rowsMarked.some(Boolean) || colsMarked.some(Boolean) || diag1 || diag2
    );
  }

  const CardGenerator = {
    COLS,
    generateCard,
    generateBatch,
    toRows,
    cardSerial,
    checkWin,
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = CardGenerator;
  } else {
    root.CardGenerator = CardGenerator;
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/**
 * print.js — Controlador de la página "Imprimir Cartones".
 * Usa cardGenerator.js para generar los cartones y arma las hojas de impresión.
 */
(function () {
  "use strict";

  const el = {
    cantidad: document.getElementById("cantidad"),
    formato: document.getElementById("formato"),
    porHoja: document.getElementById("porHoja"),
    btnGenerar: document.getElementById("btnGenerar"),
    btnImprimir: document.getElementById("btnImprimir"),
    resumen: document.getElementById("resumen"),
    vistaPrevia: document.getElementById("vistaPrevia"),
    tamanoPagina: document.getElementById("tamanoPagina"),
  };

  const LETRAS = ["B", "I", "N", "G", "O"];

  function actualizarTamanoPagina() {
    const size = el.formato.value === "a4" ? "a4" : "letter";
    el.tamanoPagina.textContent = `@page { size: ${size}; margin: 0.4in; }`;
  }

  function renderCarton(entry) {
    const { rows, serial } = entry;
    const carton = document.createElement("div");
    carton.className = "carton";

    const cabecera = document.createElement("div");
    cabecera.className = "carton__cabecera";
    cabecera.innerHTML = `<span class="carton__titulo">BINGO FAMILIAR</span><span class="carton__serial">${serial}</span>`;
    carton.appendChild(cabecera);

    const tabla = document.createElement("table");
    const thead = document.createElement("thead");
    const filaEncabezado = document.createElement("tr");
    LETRAS.forEach((l) => {
      const th = document.createElement("th");
      th.textContent = l;
      filaEncabezado.appendChild(th);
    });
    thead.appendChild(filaEncabezado);
    tabla.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      row.forEach((valor) => {
        const td = document.createElement("td");
        if (valor === null) {
          td.textContent = "LIBRE";
          td.className = "libre";
        } else {
          td.textContent = valor;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tabla.appendChild(tbody);
    carton.appendChild(tabla);

    return carton;
  }

  function generarYRenderizar() {
    const cantidad = Math.max(1, Math.min(200, Number(el.cantidad.value) || 1));
    const porHoja = Number(el.porHoja.value);
    el.cantidad.value = cantidad;

    const batch = CardGenerator.generateBatch(cantidad);

    el.vistaPrevia.innerHTML = "";
    let hojaActual = null;

    batch.forEach((entry, idx) => {
      if (idx % porHoja === 0) {
        hojaActual = document.createElement("div");
        hojaActual.className = "hoja-cartones";
        hojaActual.dataset.porHoja = String(porHoja);
        el.vistaPrevia.appendChild(hojaActual);
      }
      hojaActual.appendChild(renderCarton(entry));
    });

    const totalHojas = Math.ceil(batch.length / porHoja);
    el.resumen.textContent = `${batch.length} cartón${batch.length === 1 ? "" : "es"} generado${batch.length === 1 ? "" : "s"} en ${totalHojas} hoja${totalHojas === 1 ? "" : "s"}.`;
  }

  el.btnGenerar.addEventListener("click", generarYRenderizar);
  el.btnImprimir.addEventListener("click", () => {
    if (!el.vistaPrevia.children.length) {
      generarYRenderizar();
    }
    window.print();
  });
  el.formato.addEventListener("change", actualizarTamanoPagina);

  actualizarTamanoPagina();
  generarYRenderizar();
})();

</script>
</body>
</html>
