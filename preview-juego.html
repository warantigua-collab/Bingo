<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bingo Familiar — Juego</title>
<style>
/* =========================================================================
   Bingo Familiar — Sistema de Diseño
   Paleta guatemalteca + claridad tipo Apple. Motivo textil como firma visual.
   ========================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap');

:root {
  /* Paleta — inspirada en textiles guatemaltecos */
  --rojo-tejido: #c0392b;
  --turquesa: #14919b;
  --azul-profundo: #1b3a6b;
  --amarillo-maiz: #f2b705;
  --verde-jade: #1e8a6e;
  --morado: #6b2d75;
  --marfil: #fbf7ee;
  --marfil-suave: #f3ecdd;
  --carbon: #2a2420;
  --carbon-suave: #5a5049;

  --blanco: #ffffff;

  /* Tipografía */
  --font-display: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Radios y sombras — estilo Apple: suave, generoso */
  --radio-sm: 12px;
  --radio-md: 20px;
  --radio-lg: 28px;
  --sombra-sm: 0 2px 8px rgba(42, 36, 32, 0.08);
  --sombra-md: 0 8px 24px rgba(42, 36, 32, 0.12);
  --sombra-lg: 0 16px 40px rgba(42, 36, 32, 0.16);

  --espacio-1: 8px;
  --espacio-2: 16px;
  --espacio-3: 24px;
  --espacio-4: 32px;
  --espacio-5: 48px;
  --espacio-6: 64px;

  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--marfil);
  color: var(--carbon);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  margin: 0 0 var(--espacio-2) 0;
  letter-spacing: -0.01em;
}

h1 { font-size: clamp(2rem, 4vw, 2.75rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.25rem; }

p { margin: 0 0 var(--espacio-2) 0; }

a { color: var(--turquesa); }

img, svg { max-width: 100%; display: block; }

button {
  font-family: var(--font-body);
}

:focus-visible {
  outline: 3px solid var(--turquesa);
  outline-offset: 3px;
}

/* =========================================================================
   Firma visual: banda textil (zigzag tejido), sin imágenes — solo CSS.
   Se usa como cabecera, divisor y marco alrededor de la bola y el ganador.
   ========================================================================= */

.banda-textil {
  height: 14px;
  width: 100%;
  background-image:
    linear-gradient(135deg, var(--rojo-tejido) 25%, transparent 25.5%, transparent 50%, var(--rojo-tejido) 50.5%, var(--rojo-tejido) 75%, transparent 75.5%),
    linear-gradient(45deg, var(--amarillo-maiz) 25%, transparent 25.5%, transparent 50%, var(--amarillo-maiz) 50.5%, var(--amarillo-maiz) 75%, transparent 75.5%);
  background-size: 28px 14px, 28px 14px;
  background-position: 0 0, 14px 0;
  background-repeat: repeat-x;
  background-color: var(--turquesa);
}

.banda-textil--compacta {
  height: 8px;
}

.marco-textil {
  position: relative;
  padding: 6px;
  background: linear-gradient(135deg, var(--rojo-tejido), var(--amarillo-maiz), var(--turquesa), var(--morado));
  border-radius: var(--radio-lg);
}

.marco-textil > * {
  border-radius: calc(var(--radio-lg) - 6px);
  background: var(--blanco);
}

/* =========================================================================
   Layout base
   ========================================================================= */

.pagina {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.encabezado {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--espacio-2) var(--espacio-4);
  background: var(--blanco);
  box-shadow: var(--sombra-sm);
  position: relative;
  z-index: 5;
}

.marca {
  display: flex;
  align-items: center;
  gap: var(--espacio-2);
  text-decoration: none;
  color: var(--carbon);
}

.marca__insignia {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: conic-gradient(var(--rojo-tejido), var(--amarillo-maiz), var(--verde-jade), var(--turquesa), var(--morado), var(--rojo-tejido));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--sombra-sm);
}

.marca__insignia span {
  background: var(--blanco);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--azul-profundo);
}

.marca__texto {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.15rem;
}

nav.navegacion {
  display: flex;
  gap: var(--espacio-1);
}

nav.navegacion a {
  text-decoration: none;
  color: var(--carbon-suave);
  font-weight: 700;
  padding: 10px 16px;
  border-radius: 999px;
  transition: background 0.15s ease, color 0.15s ease;
}

nav.navegacion a:hover {
  background: var(--marfil-suave);
  color: var(--carbon);
}

nav.navegacion a[aria-current="page"] {
  background: var(--azul-profundo);
  color: var(--blanco);
}

main {
  flex: 1;
  width: 100%;
}

.contenedor {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--espacio-4);
}

footer.pie {
  text-align: center;
  padding: var(--espacio-3);
  color: var(--carbon-suave);
  font-size: 0.9rem;
}

/* =========================================================================
   Botones
   ========================================================================= */

.boton {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 1.05rem;
  border: none;
  border-radius: var(--radio-md);
  padding: 16px 28px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: var(--sombra-sm);
  min-height: 56px;
}

.boton:active {
  transform: scale(0.97);
}

.boton:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.boton--primario {
  background: var(--azul-profundo);
  color: var(--blanco);
}
.boton--primario:hover:not(:disabled) { background: #16305a; box-shadow: var(--sombra-md); }

.boton--acento {
  background: var(--rojo-tejido);
  color: var(--blanco);
}
.boton--acento:hover:not(:disabled) { background: #a83324; box-shadow: var(--sombra-md); }

.boton--exito {
  background: var(--verde-jade);
  color: var(--blanco);
}
.boton--exito:hover:not(:disabled) { background: #156f59; box-shadow: var(--sombra-md); }

.boton--secundario {
  background: var(--blanco);
  color: var(--azul-profundo);
  border: 2px solid var(--marfil-suave);
}
.boton--secundario:hover:not(:disabled) { border-color: var(--azul-profundo); }

.boton--grande {
  font-size: 1.25rem;
  padding: 20px 36px;
  min-height: 68px;
}

.boton--icono {
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 50%;
}

.grupo-botones {
  display: flex;
  gap: var(--espacio-2);
  flex-wrap: wrap;
}

/* =========================================================================
   Tarjetas / Cards genéricas
   ========================================================================= */

.tarjeta {
  background: var(--blanco);
  border-radius: var(--radio-lg);
  box-shadow: var(--sombra-md);
  padding: var(--espacio-4);
}

.rejilla {
  display: grid;
  gap: var(--espacio-3);
}

.rejilla--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.rejilla--3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* =========================================================================
   Inicio — menú principal
   ========================================================================= */

.hero {
  text-align: center;
  padding: var(--espacio-6) var(--espacio-3) var(--espacio-4);
}

.hero__ojo {
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.85rem;
  color: var(--rojo-tejido);
  background: #f9e7e2;
  padding: 6px 16px;
  border-radius: 999px;
  margin-bottom: var(--espacio-2);
}

.hero p.subtitulo {
  font-size: 1.2rem;
  color: var(--carbon-suave);
  max-width: 560px;
  margin: 0 auto var(--espacio-4);
}

.tarjeta-menu {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-2);
  text-decoration: none;
  color: var(--carbon);
  background: var(--blanco);
  border-radius: var(--radio-lg);
  padding: var(--espacio-4);
  box-shadow: var(--sombra-md);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  border-top: 6px solid var(--turquesa);
}

.tarjeta-menu:hover {
  transform: translateY(-4px);
  box-shadow: var(--sombra-lg);
}

.tarjeta-menu--juego { border-top-color: var(--rojo-tejido); }
.tarjeta-menu--imprimir { border-top-color: var(--amarillo-maiz); }
.tarjeta-menu--ayuda { border-top-color: var(--morado); }

.tarjeta-menu__icono {
  font-size: 2.5rem;
}

.tarjeta-menu__accion {
  margin-top: auto;
  font-weight: 800;
  color: var(--azul-profundo);
}

/* =========================================================================
   Pantalla de Juego — el llamador
   ========================================================================= */

.tablero-juego {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: var(--espacio-4);
  align-items: start;
}

@media (max-width: 860px) {
  .tablero-juego {
    grid-template-columns: 1fr;
  }
}

.panel-bola {
  text-align: center;
}

.bola-actual {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  margin: var(--espacio-2) auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--blanco);
  font-family: var(--font-display);
  box-shadow: var(--sombra-lg), inset 0 -8px 16px rgba(0,0,0,0.12);
  position: relative;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}

.bola-actual.rebote {
  animation: rebote 0.5s cubic-bezier(.34,1.56,.64,1);
}

@keyframes rebote {
  0% { transform: scale(0.4) translateY(-140px); opacity: 0; }
  60% { transform: scale(1.08) translateY(0); opacity: 1; }
  80% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

.bola-actual__letra {
  font-size: 1.6rem;
  font-weight: 600;
  opacity: 0.9;
}

.bola-actual__numero {
  font-size: 4.5rem;
  font-weight: 700;
  line-height: 1;
}

.bola-actual--vacia {
  background: var(--marfil-suave) !important;
  color: var(--carbon-suave);
  box-shadow: var(--sombra-sm);
}

.bola-actual--B { background: linear-gradient(155deg, var(--rojo-tejido), #93261a); }
.bola-actual--I { background: linear-gradient(155deg, var(--amarillo-maiz), #c78e00); color: var(--carbon); }
.bola-actual--N { background: linear-gradient(155deg, var(--verde-jade), #12604c); }
.bola-actual--G { background: linear-gradient(155deg, var(--turquesa), #0d6d75); }
.bola-actual--O { background: linear-gradient(155deg, var(--morado), #4a1f52); }

.frase-llamado {
  font-size: 1.4rem;
  font-weight: 800;
  min-height: 2em;
  color: var(--azul-profundo);
}

.contador-restantes {
  color: var(--carbon-suave);
  font-weight: 600;
}

.controles-juego {
  display: flex;
  justify-content: center;
  gap: var(--espacio-2);
  flex-wrap: wrap;
  margin-top: var(--espacio-3);
}

.panel-derecho {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-3);
}

/* Tabla de referencia B-I-N-G-O con todos los números */
.tabla-referencia {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.columna-letra {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.columna-letra__titulo {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--blanco);
  width: 100%;
  text-align: center;
  border-radius: var(--radio-sm);
  padding: 6px 0;
}

.columna-letra__titulo--B { background: var(--rojo-tejido); }
.columna-letra__titulo--I { background: var(--amarillo-maiz); color: var(--carbon); }
.columna-letra__titulo--N { background: var(--verde-jade); }
.columna-letra__titulo--G { background: var(--turquesa); }
.columna-letra__titulo--O { background: var(--morado); }

.numero-ref {
  width: 100%;
  text-align: center;
  padding: 5px 0;
  border-radius: 8px;
  font-weight: 700;
  color: var(--carbon-suave);
  background: var(--marfil-suave);
  font-size: 0.85rem;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}

.numero-ref.llamado {
  background: var(--azul-profundo);
  color: var(--blanco);
  transform: scale(1.05);
}

.numero-ref.actual {
  background: var(--rojo-tejido);
  color: var(--blanco);
  box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.35);
}

/* Historial de llamados (chips) */
.historial {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
  padding: var(--espacio-1);
}

.chip-numero {
  background: var(--marfil-suave);
  color: var(--carbon);
  font-weight: 800;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.9rem;
}

.chip-numero:first-child {
  background: var(--azul-profundo);
  color: var(--blanco);
}

/* =========================================================================
   Pantalla Ganador
   ========================================================================= */

.pantalla-ganador {
  position: fixed;
  inset: 0;
  background: rgba(27, 58, 107, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: var(--espacio-3);
}

.pantalla-ganador[hidden] { display: none; }

.tarjeta-ganador {
  background: var(--blanco);
  border-radius: var(--radio-lg);
  padding: var(--espacio-5);
  text-align: center;
  max-width: 420px;
  box-shadow: var(--sombra-lg);
  animation: aparecer 0.4s cubic-bezier(.34,1.56,.64,1);
}

@keyframes aparecer {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.tarjeta-ganador__emoji {
  font-size: 4rem;
}

.confeti-pieza {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  z-index: 99;
  pointer-events: none;
  animation-name: caer;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes caer {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(600deg); opacity: 0.9; }
}

/* =========================================================================
   Imprimir Cartones
   ========================================================================= */

.controles-impresion {
  display: flex;
  flex-wrap: wrap;
  gap: var(--espacio-3);
  align-items: end;
  margin-bottom: var(--espacio-3);
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.campo label {
  font-weight: 800;
  font-size: 0.9rem;
  color: var(--carbon-suave);
}

.campo select,
.campo input[type="number"] {
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 10px 14px;
  border-radius: var(--radio-sm);
  border: 2px solid var(--marfil-suave);
  background: var(--blanco);
  min-width: 160px;
}

.hoja-cartones {
  background: var(--blanco);
  page-break-after: always;
  padding: 24px;
  display: grid;
  gap: 18px;
}

.hoja-cartones[data-por-hoja="1"] { grid-template-columns: 1fr; }
.hoja-cartones[data-por-hoja="2"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
.hoja-cartones[data-por-hoja="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.hoja-cartones[data-por-hoja="6"] { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }

.carton {
  border: 3px solid var(--carbon);
  border-radius: var(--radio-sm);
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.carton__cabecera {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.carton__titulo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
}

.carton__serial {
  font-size: 0.7rem;
  color: var(--carbon-suave);
}

.carton table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.carton th {
  font-family: var(--font-display);
  color: var(--blanco);
  font-size: 0.9rem;
  padding: 4px 0;
}

.carton th:nth-child(1) { background: var(--rojo-tejido); }
.carton th:nth-child(2) { background: var(--amarillo-maiz); color: var(--carbon); }
.carton th:nth-child(3) { background: var(--verde-jade); }
.carton th:nth-child(4) { background: var(--turquesa); }
.carton th:nth-child(5) { background: var(--morado); }

.carton td {
  border: 1px solid var(--marfil-suave);
  text-align: center;
  font-weight: 700;
  padding: 6px 0;
}

.carton td.libre {
  background: var(--marfil-suave);
  font-size: 0.65rem;
  color: var(--carbon-suave);
  font-weight: 800;
}

.vista-previa-cartones {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-4);
}

@media print {
  .no-imprimir { display: none !important; }
  body { background: var(--blanco); }
  .hoja-cartones { box-shadow: none; }
}

/* =========================================================================
   Ayuda
   ========================================================================= */

.acordeon {
  display: flex;
  flex-direction: column;
  gap: var(--espacio-2);
}

.acordeon details {
  background: var(--blanco);
  border-radius: var(--radio-md);
  box-shadow: var(--sombra-sm);
  padding: var(--espacio-2) var(--espacio-3);
}

.acordeon summary {
  font-family: var(--font-display);
  font-weight: 600;
  cursor: pointer;
  font-size: 1.05rem;
}

.acordeon details[open] summary {
  margin-bottom: var(--espacio-2);
}

/* =========================================================================
   Accesibilidad y responsive general
   ========================================================================= */

.solo-lectores {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .encabezado {
    flex-direction: column;
    gap: var(--espacio-2);
    padding: var(--espacio-2);
  }
  .contenedor { padding: var(--espacio-2); }
  .bola-actual { width: 170px; height: 170px; }
  .bola-actual__numero { font-size: 3.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* Alto contraste opcional */
body.alto-contraste {
  --marfil: #ffffff;
  --marfil-suave: #eeeeee;
  --carbon: #000000;
  --carbon-suave: #000000;
}

body.alto-contraste .boton {
  border: 2px solid #000;
}

</style>
</head>
<body>
<div class="banda-textil" role="presentation"></div>

<div class="pagina">
  <header class="encabezado no-imprimir">
    <a class="marca" href="index.html">
      <span class="marca__insignia" aria-hidden="true"><span>B</span></span>
      <span class="marca__texto">Bingo Familiar</span>
    </a>
    <nav class="navegacion" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="juego.html" aria-current="page">Juego</a>
      <a href="imprimir.html">Imprimir Cartones</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
  </header>

  <main>
    <div class="contenedor">

      <div class="tarjeta" style="margin-bottom: 24px; display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between;">
        <div class="campo">
          <label for="velocidad">Velocidad automática</label>
          <select id="velocidad">
            <option value="2500">Rápida (2.5s)</option>
            <option value="4000" selected>Normal (4s)</option>
            <option value="6000">Pausada (6s)</option>
          </select>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-weight:700;">
          <input type="checkbox" id="sonido" checked />
          Sonido activado

            <button class="boton boton--primario boton--grande" id="btnSiguiente">Siguiente ▶</button>
            <button class="boton boton--secundario" id="btnAutoplay" aria-label="Reproducir automáticamente">▶ Reproducir</button>

            <button class="boton boton--secundario" id="btnFinalizar">⏹ Finalizar</button>

<!-- Pantalla Ganador -->
<div class="pantalla-ganador" id="pantallaGanador" hidden role="dialog" aria-modal="true" aria-labelledby="tituloGanador">
  <div class="tarjeta-ganador marco-textil">
    <div style="padding: 8px;">
      <div class="tarjeta-ganador__emoji" aria-hidden="true">🎉</div>
      <h2 id="tituloGanador">¡BINGO!</h2>
      <p>Tenemos un ganador. ¡Felicidades!</p>
      <div class="grupo-botones" style="justify-content:center; margin-top: 16px;">
        <button class="boton boton--primario" id="btnCerrarGanador">Continuar jugando</button>

      </div>

<script>
/**
 * bingoEngine.js
 * Motor del Bingo — 75 bolas, sin repeticiones, con historial navegable.
 * Funciona en navegador (window.BingoEngine) y en Node (module.exports) para pruebas.
 */
(function (root) {
  "use strict";

  const LETTERS = ["B", "I", "N", "G", "O"];
  const RANGES = {
    B: [1, 15],
    I: [16, 30],
    N: [31, 45],
    G: [46, 60],
    O: [61, 75],
  };

  function letterFor(n) {
    if (n <= 15) return "B";
    if (n <= 30) return "I";
    if (n <= 45) return "N";
    if (n <= 60) return "G";
    return "O";
  }

  // Fisher-Yates shuffle
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor((rng ? rng() : Math.random()) * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function createEngine(options) {
    options = options || {};
    const rng = options.rng; // for deterministic testing

    let bag = []; // orden aleatorio de 1..75
    let pointer = -1; // índice de la última bola llamada dentro de bag
    let finished = false;

    function reset() {
      const all = [];
      for (let i = 1; i <= 75; i++) all.push(i);
      bag = shuffle(all, rng);
      pointer = -1;
      finished = false;
    }

    reset(); // estado inicial listo al crear

    function current() {
      if (pointer < 0) return null;
      const n = bag[pointer];
      return { number: n, letter: letterFor(n) };
    }

    function history() {
      return bag.slice(0, pointer + 1).map((n) => ({ number: n, letter: letterFor(n) }));
    }

    function remainingCount() {
      return bag.length - (pointer + 1);
    }

    function next() {
      if (finished) return current();
      if (pointer >= bag.length - 1) {
        finished = true;
        return current();
      }
      pointer += 1;
      if (pointer === bag.length - 1) finished = true;
      return current();
    }

    function previous() {
      if (pointer < 0) return null;
      pointer -= 1;
      finished = false;
      return current();
    }

    function isFinished() {
      return finished;
    }

    function calledSet() {
      return new Set(bag.slice(0, pointer + 1));
    }

    return {
      reset,
      next,
      previous,
      current,
      history,
      remainingCount,
      isFinished,
      calledSet,
      LETTERS,
      RANGES,
      letterFor,
    };
  }

  const BingoEngine = { createEngine, letterFor, LETTERS, RANGES, shuffle };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = BingoEngine;
  } else {
    root.BingoEngine = BingoEngine;
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/**
 * audio.js — Efectos de sonido sintetizados con Web Audio API.
 * No depende de archivos externos (mp3/wav), por lo que no hay nada que
 * descargar ni que se pueda romper por rutas de archivo incorrectas.
 */
(function (root) {
  "use strict";

  let ctx = null;
  let enabled = true;

  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function tone({ freq = 440, duration = 0.15, type = "sine", gain = 0.2, delay = 0, glide = null }) {
    if (!enabled) return;
    const c = getCtx();
    const osc = c.createOscillator();
    const amp = c.createGain();
    osc.type = type;
    const t0 = c.currentTime + delay;
    osc.frequency.setValueAtTime(freq, t0);
    if (glide) osc.frequency.linearRampToValueAtTime(glide, t0 + duration);
    amp.gain.setValueAtTime(0, t0);
    amp.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    amp.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(amp).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  const Sounds = {
    setEnabled(v) {
      enabled = v;
    },
    isEnabled() {
      return enabled;
    },
    click() {
      tone({ freq: 520, duration: 0.06, type: "square", gain: 0.12 });
    },
    ballCall() {
      tone({ freq: 300, duration: 0.18, type: "triangle", gain: 0.22, glide: 520 });
      tone({ freq: 700, duration: 0.1, type: "sine", gain: 0.1, delay: 0.05 });
    },
    pause() {
      tone({ freq: 440, duration: 0.15, type: "sine", gain: 0.15, glide: 220 });
    },
    resume() {
      tone({ freq: 300, duration: 0.15, type: "sine", gain: 0.15, glide: 500 });
    },
    reset() {
      tone({ freq: 600, duration: 0.08, type: "sine", gain: 0.15 });
      tone({ freq: 400, duration: 0.08, type: "sine", gain: 0.15, delay: 0.08 });
      tone({ freq: 250, duration: 0.12, type: "sine", gain: 0.15, delay: 0.16 });
    },
    bingo() {
      // pequeño arpegio festivo
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => tone({ freq: f, duration: 0.35, type: "triangle", gain: 0.22, delay: i * 0.12 }));
    },
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = Sounds;
  } else {
    root.Sounds = Sounds;
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/**
 * confetti.js — Efecto de confeti con divs + CSS, sin canvas ni librerías.
 */
(function (root) {
  "use strict";

  const COLORES = ["#c0392b", "#14919b", "#1b3a6b", "#f2b705", "#1e8a6e", "#6b2d75"];

  function lanzarConfeti(cantidad) {
    cantidad = cantidad || 80;
    const frag = document.createDocumentFragment();
    const piezas = [];
    for (let i = 0; i < cantidad; i++) {
      const pieza = document.createElement("div");
      pieza.className = "confeti-pieza";
      const izquierda = Math.random() * 100;
      const duracion = 2.2 + Math.random() * 1.8;
      const retraso = Math.random() * 0.6;
      const color = COLORES[Math.floor(Math.random() * COLORES.length)];
      pieza.style.left = izquierda + "vw";
      pieza.style.background = color;
      pieza.style.animationDuration = duracion + "s";
      pieza.style.animationDelay = retraso + "s";
      pieza.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      frag.appendChild(pieza);
      piezas.push(pieza);
    }
    document.body.appendChild(frag);
    setTimeout(() => {
      piezas.forEach((p) => p.remove());
    }, 4500);
  }

  const Confeti = { lanzarConfeti };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = Confeti;
  } else {
    root.Confeti = Confeti;
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/**
 * juego.js — Controlador de la pantalla del anfitrión.
 * Une bingoEngine.js (lógica) con el DOM, audio.js y confetti.js.
 */
(function () {
  "use strict";

  const engine = BingoEngine.createEngine();

  const el = {
    bola: document.getElementById("bolaActual"),
    bolaLetra: document.getElementById("bolaLetra"),
    bolaNumero: document.getElementById("bolaNumero"),
    frase: document.getElementById("fraseLlamado"),
    contador: document.getElementById("contadorRestantes"),
    btnAnterior: document.getElementById("btnAnterior"),
    btnSiguiente: document.getElementById("btnSiguiente"),
    btnAutoplay: document.getElementById("btnAutoplay"),
    btnReiniciar: document.getElementById("btnReiniciar"),
    btnFinalizar: document.getElementById("btnFinalizar"),
    btnGanador: document.getElementById("btnGanador"),
    velocidad: document.getElementById("velocidad"),
    sonido: document.getElementById("sonido"),
    altoContraste: document.getElementById("altoContraste"),
    tablaReferencia: document.getElementById("tablaReferencia"),
    historial: document.getElementById("historial"),
    pantallaGanador: document.getElementById("pantallaGanador"),
    btnCerrarGanador: document.getElementById("btnCerrarGanador"),
    btnNuevaPartidaGanador: document.getElementById("btnNuevaPartidaGanador"),
  };

  let autoplayTimer = null;
  let finalizado = false;

  // ---- Construir la tabla de referencia (1..75) una sola vez ----
  function construirTablaReferencia() {
    el.tablaReferencia.innerHTML = "";
    BingoEngine.LETTERS.forEach((letra) => {
      const [min, max] = BingoEngine.RANGES[letra];
      const columna = document.createElement("div");
      columna.className = "columna-letra";

      const titulo = document.createElement("div");
      titulo.className = `columna-letra__titulo columna-letra__titulo--${letra}`;
      titulo.textContent = letra;
      columna.appendChild(titulo);

      for (let n = min; n <= max; n++) {
        const casilla = document.createElement("div");
        casilla.className = "numero-ref";
        casilla.dataset.numero = String(n);
        casilla.textContent = n;
        columna.appendChild(casilla);
      }
      el.tablaReferencia.appendChild(columna);
    });
  }

  function actualizarTablaReferencia() {
    const llamados = engine.calledSet();
    const actual = engine.current();
    const casillas = el.tablaReferencia.querySelectorAll(".numero-ref");
    casillas.forEach((c) => {
      const n = Number(c.dataset.numero);
      c.classList.toggle("llamado", llamados.has(n));
      c.classList.toggle("actual", !!actual && actual.number === n);
    });
  }

  function actualizarHistorial() {
    const hist = engine.history();
    if (hist.length === 0) {
      el.historial.innerHTML = '<span class="contador-restantes">Aún no se ha llamado ninguna bola.</span>';
      return;
    }
    el.historial.innerHTML = "";
    hist
      .slice()
      .reverse()
      .forEach((h) => {
        const chip = document.createElement("span");
        chip.className = "chip-numero";
        chip.textContent = `${h.letter}-${h.number}`;
        el.historial.appendChild(chip);
      });
  }

  function actualizarBola(animar) {
    const actual = engine.current();
    el.bola.classList.remove("rebote");
    if (!actual) {
      el.bola.className = "bola-actual bola-actual--vacia";
      el.bolaLetra.textContent = "\u00A0";
      el.bolaNumero.textContent = "—";
      el.frase.textContent = finalizado ? "Partida finalizada." : 'Presiona "Siguiente" para comenzar';
    } else {
      el.bola.className = `bola-actual bola-actual--${actual.letter}`;
      el.bolaLetra.textContent = actual.letter;
      el.bolaNumero.textContent = String(actual.number);
      el.frase.textContent = `${actual.letter} - ${actual.number}`;
      if (animar) {
        // fuerza el reinicio de la animación
        void el.bola.offsetWidth;
        el.bola.classList.add("rebote");
      }
    }
    el.contador.textContent = finalizado
      ? "Partida finalizada"
      : `${engine.remainingCount()} bola${engine.remainingCount() === 1 ? "" : "s"} por llamar`;
  }

  function actualizarControles() {
    const hist = engine.history();
    el.btnAnterior.disabled = hist.length === 0 || finalizado;
    el.btnSiguiente.disabled = engine.isFinished() || finalizado;
    el.btnAutoplay.disabled = engine.isFinished() || finalizado;
  }

  function refrescarTodo(animar) {
    actualizarBola(animar);
    actualizarTablaReferencia();
    actualizarHistorial();
    actualizarControles();
  }

  function detenerAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
      el.btnAutoplay.textContent = "▶ Reproducir";
    }
  }

  function reproducirSonido(nombre) {
    if (!el.sonido.checked) return;
    try {
      Sounds[nombre]();
    } catch (e) {
      /* silencioso: el audio nunca debe romper el juego */
    }
  }

  // ---- Acciones ----

  function irSiguiente() {
    if (finalizado || engine.isFinished()) return;
    engine.next();
    reproducirSonido("ballCall");
    refrescarTodo(true);
    if (engine.isFinished()) {
      detenerAutoplay();
    }
  }

  function irAnterior() {
    if (finalizado) return;
    detenerAutoplay();
    engine.previous();
    reproducirSonido("click");
    refrescarTodo(false);
  }

  function alternarAutoplay() {
    if (finalizado) return;
    if (autoplayTimer) {
      detenerAutoplay();
      reproducirSonido("pause");
      return;
    }
    reproducirSonido("resume");
    el.btnAutoplay.textContent = "⏸ Pausar";
    const intervalo = Number(el.velocidad.value);
    autoplayTimer = setInterval(() => {
      if (engine.isFinished() || finalizado) {
        detenerAutoplay();
        return;
      }
      irSiguiente();
    }, intervalo);
  }

  function reiniciar() {
    const hist = engine.history();
    if (hist.length > 0) {
      const confirmado = window.confirm("¿Reiniciar la partida? Se perderá el historial de llamados actual.");
      if (!confirmado) return;
    }
    detenerAutoplay();
    finalizado = false;
    engine.reset();
    reproducirSonido("reset");
    refrescarTodo(false);
  }

  function finalizar() {
    if (finalizado) return;
    detenerAutoplay();
    finalizado = true;
    refrescarTodo(false);
  }

  function declararGanador() {
    detenerAutoplay();
    reproducirSonido("bingo");
    Confeti.lanzarConfeti(90);
    el.pantallaGanador.hidden = false;
    el.btnCerrarGanador.focus();
  }

  function cerrarGanador() {
    el.pantallaGanador.hidden = true;
    el.btnGanador.focus();
  }

  function nuevaPartidaDesdeGanador() {
    el.pantallaGanador.hidden = true;
    finalizado = false;
    engine.reset();
    reproducirSonido("reset");
    refrescarTodo(false);
  }

  // ---- Eventos ----
  el.btnSiguiente.addEventListener("click", irSiguiente);
  el.btnAnterior.addEventListener("click", irAnterior);
  el.btnAutoplay.addEventListener("click", alternarAutoplay);
  el.btnReiniciar.addEventListener("click", reiniciar);
  el.btnFinalizar.addEventListener("click", finalizar);
  el.btnGanador.addEventListener("click", declararGanador);
  el.btnCerrarGanador.addEventListener("click", cerrarGanador);
  el.btnNuevaPartidaGanador.addEventListener("click", nuevaPartidaDesdeGanador);

  el.velocidad.addEventListener("change", () => {
    if (autoplayTimer) {
      detenerAutoplay();
      alternarAutoplay();
    }
  });

  el.altoContraste.addEventListener("change", () => {
    document.body.classList.toggle("alto-contraste", el.altoContraste.checked);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.code === "Space" || e.key === "ArrowRight") {
      e.preventDefault();
      irSiguiente();
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      irAnterior();
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (engine.history().length > 0 && !finalizado) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // ---- Inicio ----
  construirTablaReferencia();
  refrescarTodo(false);
})();

</script>
