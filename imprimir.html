<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bingo Familiar — Imprimir Cartones</title>
<link rel="stylesheet" href="css/styles.css" />
<style id="tamanoPagina">
  @page { size: letter; margin: 0.4in; }
</style>
</head>
<body>
<div class="banda-textil no-imprimir" role="presentation"></div>

<div class="pagina">
  <header class="encabezado no-imprimir">
    <a class="marca" href="index.html">
      <span class="marca__insignia" aria-hidden="true"><span>B</span></span>
      <span class="marca__texto">Bingo Familiar</span>
    </a>
    <nav class="navegacion" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="juego.html">Juego</a>
      <a href="imprimir.html" aria-current="page">Imprimir Cartones</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
  </header>

  <main>
    <div class="contenedor">
      <h1 class="no-imprimir">Imprimir Cartones</h1>
      <p class="no-imprimir">Genera cartones únicos, revisa la vista previa y luego imprime.</p>

      <div class="tarjeta no-imprimir">
        <div class="controles-impresion">
          <div class="campo">
            <label for="cantidad">Cantidad de cartones</label>
            <input type="number" id="cantidad" min="1" max="200" value="12" />
          </div>
          <div class="campo">
            <label for="formato">Tamaño de página</label>
            <select id="formato">
              <option value="letter" selected>Carta (Letter)</option>
              <option value="a4">A4</option>
            </select>
          </div>
          <div class="campo">
            <label for="porHoja">Cartones por hoja</label>
            <select id="porHoja">
              <option value="1">1 por hoja</option>
              <option value="2">2 por hoja</option>
              <option value="4" selected>4 por hoja</option>
              <option value="6">6 por hoja</option>
            </select>
          </div>
          <button class="boton boton--primario" id="btnGenerar">Generar cartones</button>
          <button class="boton boton--exito" id="btnImprimir">🖨️ Imprimir</button>
        </div>
        <p class="contador-restantes" id="resumen">Aún no se han generado cartones.</p>
      </div>

      <div class="vista-previa-cartones" id="vistaPrevia"></div>
    </div>
  </main>

  <footer class="pie no-imprimir">
    Bingo Familiar en Español · v1.0
  </footer>
</div>

<script src="js/print/cardGenerator.js"></script>
<script src="js/print/print.js"></script>
</body>
</html>
